spring.application.name=stocktracker

spring.datasource.url=jdbc:mysql://localhost:3306/stockdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# OSIV 关闭（2026-10-27 压测发现）：open-in-view 会把 EntityManager（连带一个
# 数据库连接）钉到请求结束——SSE 这类 async 请求的"结束"是连接断开，于是每条
# 活跃行情流占住一个 Hikari 连接；默认池 10 条 → 全局最多同时 10 条 SSE，挂满时
# 全站查库接口一起排队 30s。复现与验证脚本：loadtest/sse_hold.py，
# 完整分析见 loadtest/results/report-2026-10-27.md。
spring.jpa.open-in-view=false

# Caching Configuration（缓存名单唯一出处是 RedisCacheConfig.CACHE_NAMES）
spring.cache.type=redis

# SSE: async request timeout -1 = never time out (SSE long connection)
spring.mvc.async.request-timeout=-1

# Logging Configuration
logging.level.com.happyericsix.stocktracker=INFO

# RSA JWT 密钥：默认读 secrets/ 目录（gitignore，绝不进仓库）。
# 密钥生成：openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out secrets/app.key
#           openssl pkey -in secrets/app.key -pubout -out secrets/app.pub
# 部署时用环境变量指向挂载路径，例如 RSA_PRIVATE_KEY_PATH=file:/run/secrets/app.key。
# ⚠️ 2026-09-21 前仓库 classpath 里曾提交过一对真实密钥并已推送——已轮换并取消跟踪，
#   但 git 历史里仍可翻到旧密钥（如需彻底清除要重写历史 + 强推，单独决定）。
rsa.private-key=${RSA_PRIVATE_KEY_PATH:file:secrets/app.key}
rsa.public-key=${RSA_PUBLIC_KEY_PATH:file:secrets/app.pub}
jwt.expiration=86400000

# Java -> Python 服务间调用共享密钥（与 python-data-service/.env 的 INTERNAL_API_TOKEN 一致）。
# 默认必须为空：未配置时所有内部接口一律拒绝（fail-closed，见 Internal*Controller#authorized）。
# 这里曾是一个"写在仓库里的默认值"——等于把内部接口的钥匙公开发布（2026-10-05 安全检查 P1 项），已删除。
internal.api-token=${INTERNAL_API_TOKEN:}

# 注册开关：本地开发默认开；公网部署自己注册完就设 AUTH_REGISTRATION_ENABLED=false 关掉。
# 开放注册的真实代价：每个新账号都能无限触发 LLM 调用，烧的是你的 DeepSeek 额度。
# （2026-10-25 BYOK 上线后用户触发的 AI 已改烧用户自己的 Key，这条主要约束的是
#  新闻解读等系统级任务的全局额度与注册滥用的资源面。）
auth.registration-enabled=${AUTH_REGISTRATION_ENABLED:true}

# 用户自带 LLM Key 的加密密钥（AES/GCM 加密 user_llm_configs 里的两把 key）。
# 默认为空：未配置时 Key 保管功能不可用（接口返回 enabled=false，前端明示），
# 应用本身可启动——与 ths.aes.key 同一条 fail-closed 纪律，绝不内置默认密钥。
# 生成方式：openssl rand -hex 24。⚠️ 换了它，所有用户已保存的 Key 都要重新输入。
llm.aes.key=${LLM_AES_KEY:}

# CORS 白名单。前端与 /api 同源（Vite 代理 / nginx 反代），正常部署用不到跨域；
# 这里只需要覆盖开发地址（之前是通配 *，已收紧——2026-10-05 安全检查 P2 项）。
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Redis Connection
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.max-active=16

# Akshare Python Data Service
akshare.api.base-url=http://localhost:8000

# 同花顺会话加密密钥（用于 AES/GCM 加密 ths_bindings.session_encrypted）
# 默认为空：未配置时加解密直接抛错（AesGcmCipher fail-closed），THS 绑定功能不可用但应用可启动。
# 改了密钥，之前加密存的凭证就解不开了（需要重新扫码）。
# （此前这里有一个仓库内 dev 默认值，与 internal token 同一类问题，已删除。）
ths.aes.key=${THS_AES_KEY:}

# Bark 推送目标 SSRF 栏（2026-10-15 安全测试 L1）：默认拒绝环回/内网/链路本地地址。
# 自托管 Bark 部署在局域网（NAS 等）时才显式改为 true。
push.bark.allow-private-addresses=${PUSH_BARK_ALLOW_PRIVATE:false}

# ---- 资讯时效（NewsRetentionJob 每晚按此清理过期条目）----
# 快讯过期即噪音；宏观/政策有跟踪价值；公告与研报是法定披露与深度参考，留最长
news.retention.flash-days=3
news.retention.macro-days=30
news.retention.policy-days=30
news.retention.geo-days=30
news.retention.opinion-days=7
news.retention.company-days=30
news.retention.earnings-days=30
news.retention.industry-days=30
news.retention.default-days=30
news.retention.disclosure-days=180

# ---- 事件线/新闻专题（2026-10-09 新闻雷达升级：NewsTopicJob 交易日 9-16 点每小时）----
# 聚类层纯代码（Python N4），关掉只是不更新专题；LLM 层（总编+撰稿）单独可关
news.topics.enabled=true
news.topics.window-days=7
news.topics.max-events=500
news.editor.enabled=true
# 每日撰稿 LLM 预算（按 news_topics.synthesized_at 当日成功数记账，跨重启不丢）
news.editor.daily-budget=30
# 同一事件线两次撰稿之间的冷却（新成员到来也先等冷却过，避免反复重写）
news.editor.cooldown-minutes=90

# ==================== 策略哨兵（健康监控 Phase 1） ====================
# 判据阈值与冷却窗口；不配置则用代码内默认值（写在 StrategyHealthWatchService 的 @Value 里）
health.idle-days-threshold=10
health.drawdown-breach-multiplier=1.2
health.news-credibility-min=70
health.cooldown-idle-days=10
health.cooldown-drawdown-days=5
health.cooldown-verification-days=7
health.cooldown-news-days=3
