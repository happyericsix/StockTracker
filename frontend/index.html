<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 墨阶：侧栏墨色。独立模式下状态栏与侧栏连成一片 -->
    <meta name="theme-color" content="#13151c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stock" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>StockTracker</title>
    <meta name="description" content="量化股票分析助手：查行情、设预警、管理策略与回测。" />
    <script>
      // 首帧前定主题，避免暗色用户看到一次白闪（FOUC）
      ;(function () {
        try {
          var t = localStorage.getItem('theme') || 'system'
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
