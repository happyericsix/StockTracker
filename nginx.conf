# =============================================================================
# HTTPS 版 nginx 配置模板（PWA 的最后一块拼图）
#
# 什么时候用这个文件：域名备案下来、证书已按 DEPLOY.md §9 签发之后。
# 做法：cp nginx-https.conf.example nginx.conf，把下面两处 stocktracker.com.cn
#       全部替换成你的真实域名，重打 frontend 镜像走既有部署流（§2~§4）。
# 回退：把 nginx.conf 换回原版（git 里的）重打镜像即可；证书留在
#       secrets/certs/ 不碍事。
#
# 与原版的结构差异（行为对齐说明）：
#   ① 80 端口拆成两个 server：默认 server 继续用 IP 直连（保持现状，
#      服务器上没有"域名必须跳转"的强制），域名 server 301 到 https；
#   ② 新增 443 server：业务配置与 80 完全同源（限流/SSE/no-cache 一字不差），
#      只是套上 TLS；
#   ③ HSTS 刻意注释着：它一旦下发浏览器会长期强制 https，回退窗口直接关死。
#      确认 HTTPS 稳定运行几周后再放开。
#
# 本文件被 nginx 镜像 include 进 http 上下文（/etc/nginx/conf.d/default.conf），
# 所以 limit_req_zone 可以直接在这里声明。

# 公网限流（2026-10-05 安全检查 P1-3）：
#   auth   1 r/s + burst 5 —— 防登录爆破/批量注册（配合后端的注册开关）
#   api   10 r/s + burst 20 —— 通用兜底；正常用户界面远达不到这个频率
# SSE 长连接不受影响：限流管的是"每秒新建多少请求"，已建立的连接不计数。
# 命中限流返回 429 而不是默认的 503，前端能把"太快了"和"服务挂了"区分开。
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_status 429;

# 文本压缩（2026-10-24 Lighthouse 实测：不压缩时手机端 FCP/LCP 高达 10.4s，
# 1.9MB 的 JS 裸传是主因）。SSE（text/event-stream）不在列表里，不会被压缩。
# gzip 只压 >1k 的响应，小响应压了反而慢。gzip_vary 让 CDN/代理也能命中。
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

# ---------------------------------------------------------------------------
# 80：IP 直连入口（不强制跳转 —— 保留原体验，等价于原版 nginx.conf 整个 server）
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    # 业务配置与 443 同源，改一处时记得两边同步（或用 nano 抽 include，这里刻意
    # 平铺：模板要能被整体 diff 出来，include 反而藏差异）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        # 带内容 hash 的静态资源可以永久缓存（文件名变了自然失效）
        location ~* \.(js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # SPA 入口必须每次向服务器校验新鲜度：index.html 引用的是带 hash 的资源名，
    # 文档被缓存住 = 整个应用被缓存住 —— 发版后用户会一直拿到旧 hash 的旧页面
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # PWA：sw.js 与 manifest 永远走网络（sw.js 更新是整个 PWA 的升级通道）
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        # 本版 nginx 的 mime.types 没收录 .webmanifest（线上实测返回 octet-stream，
        # Chrome 尚能容忍，Safari/Lighthouse 会拒绝 → 影响可安装性判定）
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # 版本比对端点（main.js checkVersion 每 2 分钟拉）：永远拿最新值，
    # 绝不进任何缓存——缓存住它 = 老应用永远以为自己是新的
    location = /version.json {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # 认证端点：最严的一档（登录爆破、批量注册都打这里）
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 长连接必需：禁止缓冲、禁用代理缓存、加长读超时
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }
}

# ---------------------------------------------------------------------------
# 80：域名入口只干一件事 —— 301 到 https（浏览器地址栏敲域名不该停留在明文）
# ---------------------------------------------------------------------------
server {
    listen 80;
    # www 一并 301（证书 SAN 已覆盖 www；DNS 里 www 与主域名同 IP）
    server_name stocktracker.com.cn www.stocktracker.com.cn;

    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# 443：正式入口。证书由 acme.sh 装到宿主机 secrets/certs/，compose 以只读挂载
# 进来（见 docker-compose.yml frontend 服务）—— 证书不进镜像、不进 git。
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    # nginx:alpine（≥1.25）的新写法；老写法 "listen 443 ssl http2" 已弃用但仍可用
    http2 on;
    # www 同证书同服务（SAN 覆盖两个域名，https://www 不再有证书警告）
    server_name stocktracker.com.cn www.stocktracker.com.cn;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # TLS 1.2 兜底老安卓 WebView，1.3 为主；证书套现代椭圆曲线+AES-GCM
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # OCSP 装订：浏览器少一次往返；装订要查 OCSP 地址，必须给 nginx 一个 DNS
    # （阿里云机器用 223.5.5.5 / 腾讯 119.29.29.29 最稳；不配 resolver 时
    # 装订静默失效，只留一条 warning 日志）
    resolver 223.5.5.5 119.29.29.29 valid=300s;
    ssl_stapling on;
    ssl_stapling_verify on;

    # 确认 HTTPS 稳定运行几周后再放开（下发后浏览器长期强制 https，回退窗口关死）：
    # add_header Strict-Transport-Security "max-age=15552000" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        location ~* \.(js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        # 同 80 端口：webmanifest 必须是 application/manifest+json（可安装性）
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # 版本比对端点：同 80 端口（两处 server 的业务配置保持同源）
    location = /version.json {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # SSE 长连接必需：禁止缓冲、禁用代理缓存、加长读超时
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }
}
