# 本文件被 nginx 镜像 include 进 http 上下文（/etc/nginx/conf.d/default.conf），
# 所以 limit_req_zone 可以直接在这里声明。

# 公网限流（2026-10-05 安全检查 P1-3）：
#   auth   1 r/s + burst 5 —— 防登录爆破/批量注册（配合后端的注册开关）
#   api   10 r/s + burst 20 —— 通用兜底；正常用户界面远达不到这个频率
# SSE 长连接不受影响：限流管的是"每秒新建多少请求"，已建立的连接不计数。
# 命中限流返回 429 而不是默认的 503，前端能把"太快了"和"服务挂了"区分开。
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        # 带内容 hash 的静态资源可以永久缓存（文件名变了自然失效）
        location ~* \.(js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # SPA 入口必须每次向服务器校验新鲜度：index.html 引用的是带 hash 的资源名，
    # 文档被缓存住 = 整个应用被缓存住 —— 发版后用户会一直拿到旧 hash 的旧页面
    #（2026-10-07 发版实测踩到：浏览器沿用旧 index.html，新 CSS 根本没被请求）
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # PWA：sw.js 与 manifest 永远走网络（sw.js 更新是整个 PWA 的升级通道）
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # 认证端点：最严的一档（登录爆破、批量注册都打这里）
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 长连接必需：禁止缓冲、禁用代理缓存、加长读超时
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }
}
